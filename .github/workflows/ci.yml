name: TDVP Build and Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      promote_run_id:
        description: Successful CI run to publish as r12-rc1 (leave empty to build)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tdvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: ${{ inputs.promote_run_id == '' }}
    name: Build K230 SD image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      TDVP_CACHE_ROOT: ${{ github.workspace }}/.ci-cache
      TDVP_CPU1_CACHE_ROOT: ${{ github.workspace }}/.ci-cache/cpu1
      TDVP_CPU1_TOOLCHAIN_DIR: ${{ github.workspace }}/.ci-cache/cpu1/toolchain
      TDVP_K230_RELEASE_NAME: tdvp-k230-labwc-desktop-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - name: Check out platform sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Establish runner-local SDK worktree path
        run: echo "TDVP_WORKTREE=${RUNNER_TEMP}/tdvp-sdk" >> "$GITHUB_ENV"

      - name: Restore SDK source and toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/dl
            .ci-cache/toolchain
            .ci-cache/cpu1
          key: tdvp-k230-sdk-${{ runner.os }}-${{ hashFiles('buildroot/sdk-sources.lock') }}
          restore-keys: |
            tdvp-k230-sdk-${{ runner.os }}-

      - name: Install reproducible build host
        timeout-minutes: 40
        run: |
          chmod +x buildroot/tools/*.sh
          bash buildroot/tools/ci-prepare-host.sh

      - name: Validate patch queue and CPU boot contracts
        run: |
          bash buildroot/tools/validate-k230-sdk-linux-patches.sh buildroot/k230-sdk-overlay/linux
          bash buildroot/tools/test-reconcile-k230-sdk-linux-patches.sh
          bash buildroot/tools/test-tdvp-renderer-stack-lock.sh
          sudo bash buildroot/tools/test-tdvp-renderer-profile.sh
          sudo bash buildroot/tools/test-tdvp-labwc-session-recovery.sh
          bash buildroot/tools/test-tdvp-cpu1-boot-contract.sh
          bash buildroot/tools/test-tdvp-boot-decompressor.sh
          bash buildroot/tools/test-tdvp-cpu1-build-env.sh
          bash buildroot/tools/test-tdvp-cpu1-mailbox.sh
          bash buildroot/tools/test-tdvp-cpu1-vision-init.sh
          bash buildroot/tools/test-tdvp-cpu1-vision-pins.sh
          bash buildroot/tools/test-tdvp-cpu1-transport.sh
          bash buildroot/tools/test-tdvp-cpu1-shared-map.sh
          bash buildroot/tools/test-tdvp-cpu1-calibration.sh
          bash buildroot/tools/test-tdvp-cpu1-frame-probe.sh
          bash buildroot/tools/test-tdvp-cpu1-vision-status.sh
          bash buildroot/tools/test-tdvp-cpu1-gpio-amp.sh
          bash buildroot/tools/test-tdvp-lora-status.sh
          bash buildroot/tools/test-tdvp-nrf52840-at.sh
          bash buildroot/tools/test-tdvp-keyboard-backlight.sh
          bash buildroot/tools/test-tdvp-vglite-diagnostics-report.sh
          bash buildroot/tools/test-tdvp-vglite-session-gate.sh
          bash buildroot/tools/test-tdvp-camera-legacy-abi.sh
          bash buildroot/tools/test-tdvp-camera-i2c.sh
          bash buildroot/tools/test-tdvp-camera-package.sh
          python3 buildroot/tools/test-tdvp-application-menu.py
          sh buildroot/tools/test-tdvp-application-menu.sh
          bash buildroot/tools/test-tdvp-profile-config.sh
          bash buildroot/tools/test-tdvp-cpu0-dts-queue.sh
          bash buildroot/tools/test-tdvp-session-idle-contract.sh
          bash buildroot/tools/test-tdvp-auth-image.sh
          bash buildroot/tools/test-tdvp-image-source-contract.sh
          python3 buildroot/tools/test-tdvp-opkg-image-seed.py
          python3 buildroot/tools/test-tdvp-sdk.py
          sudo python3 buildroot/tools/test-tdvp-release-permissions.py
          bash buildroot/tools/test-verify-sdcard-image-volumepulse-guard.sh
          bash buildroot/tools/test-tdvp-display-smoke-cleanup.sh
          bash buildroot/tools/test-tdvp-vblank-observer-maintenance-master.sh
          bash buildroot/tools/test-tdvp-kms-maintenance.sh

      - name: Prepare isolated SDK validation host
        run: |
          docker build -t tdvp-sdk-validation:ubuntu24.04 \
            -f buildroot/tools/sdk/Dockerfile.validation buildroot/tools/sdk

      - name: Verify isolated SDK validation host contract
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/buildroot/tools/sdk/host-environment.json,dst=/host-environment.json,readonly" \
            tdvp-sdk-validation:ubuntu24.04 \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LC_ALL=C \
            python3 -c 'import json, shutil, sys; commands = json.load(open("/host-environment.json"))["required_commands"]; missing = [command for command in commands if shutil.which(command) is None]; print("TDVP isolated SDK host: PASS " + ", ".join(commands)) if not missing else sys.exit("TDVP isolated SDK host misses required commands: " + ", ".join(missing))'

      - name: Compile SDK package smoke source in the isolated host
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/buildroot/tools/sdk/verify-sdk.py,dst=/verify-sdk.py,readonly" \
            tdvp-sdk-validation:ubuntu24.04 \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LC_ALL=C \
            bash -c 'python3 -c "import importlib.util; spec = importlib.util.spec_from_file_location(\"sdk_verify\", \"/verify-sdk.py\"); module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module); print(module.PACKAGE_SDK_SOURCE, end=\"\")" | gcc -Werror -fsyntax-only -x c - $(pkg-config --cflags --libs ncursesw libcurl glib-2.0 openssl zlib)'

      - name: Build and regress CPU1 firmware before the Linux image
        run: |
          bash buildroot/tools/test-tdvp-cpu1-rtsmart-build.sh "${RUNNER_TEMP}/tdvp-cpu1-preflight"

      - name: Stage pinned SDK worktree
        run: |
          rm -rf "$TDVP_WORKTREE"
          bash buildroot/tools/prepare-k230-sdk-worktree.sh "$TDVP_WORKTREE"
          mkdir -p "$TDVP_CACHE_ROOT/dl"
          rm -rf "$TDVP_WORKTREE/dl"
          ln -s "$TDVP_CACHE_ROOT/dl" "$TDVP_WORKTREE/dl"

      - name: Replay and inspect the kernel patch queue
        run: |
          bash buildroot/tools/build-k230-sdk-rm69a10.sh "$TDVP_WORKTREE" linux-patch
          bash buildroot/tools/assert-k230-sdk-rm69a10-baseline.sh --patch-only "$TDVP_WORKTREE"
          kernel_commit="$(python3 -c 'import configparser; c = configparser.ConfigParser(); c.read("buildroot/sdk-sources.lock"); print(c["linux_kernel"]["commit"])')"
          [[ "$kernel_commit" =~ ^[0-9a-f]{40}$ ]]
          kernel_source="$TDVP_WORKTREE/output/k230_canmv_t_display_rm69a10_labwc_desktop_defconfig/build/linux-$kernel_commit"
          bash buildroot/tools/test-tdvp-cpu1-power-amp.sh "$kernel_source" --patched
          bash buildroot/tools/test-tdvp-cpu1-clock-amp.sh "$kernel_source" --patched
          bash buildroot/tools/test-tdvp-cpu1-vision-dtb.sh "$kernel_source" "${RUNNER_TEMP}/tdvp-cpu1-preflight/manifest"

      - name: Verify opkg parser and package protections before image build
        run: |
          bash buildroot/tools/build-k230-sdk-rm69a10.sh "$TDVP_WORKTREE" opkg-extract
          bash buildroot/tools/test-tdvp-opkg-image-native.sh \
            "$TDVP_WORKTREE/output/k230_canmv_t_display_rm69a10_labwc_desktop_defconfig/build/opkg-0.7.0"

      - name: Build the bootable SD image
        run: bash buildroot/tools/build-k230-sdk-rm69a10.sh "$TDVP_WORKTREE"

      - name: Verify image and collect the release bundle
        run: |
          bash buildroot/tools/test-tdvp-cpu1-linux-package.sh \
            "$TDVP_WORKTREE/output/k230_canmv_t_display_rm69a10_labwc_desktop_defconfig/target/lib/modules/6.6.36/updates/tdvp_cpu1_vision.ko" \
            "$TDVP_WORKTREE/output/k230_canmv_t_display_rm69a10_labwc_desktop_defconfig/host/sbin/depmod"
          bash buildroot/tools/test-tdvp-uart1-dtb.sh \
            "$TDVP_WORKTREE/output/k230_canmv_t_display_rm69a10_labwc_desktop_defconfig/images/k230-canmv-rm69a10.dtb" \
            "$TDVP_WORKTREE/output/k230_canmv_t_display_rm69a10_labwc_desktop_defconfig/host/bin"
          bash buildroot/tools/assert-k230-sdk-rm69a10-baseline.sh "$TDVP_WORKTREE"
          bash buildroot/tools/assert-public-release.sh "$TDVP_WORKTREE"
          bash buildroot/tools/collect-release-bundle.sh \
            "$TDVP_WORKTREE" \
            "$TDVP_K230_RELEASE_NAME"

      - name: Validate the paired SDK in isolated Ubuntu 24.04
        run: |
          set -euo pipefail
          bash buildroot/tools/test-tdvp-sdk-relocation.sh \
            "output/${TDVP_K230_RELEASE_NAME}/${TDVP_K230_RELEASE_NAME}-cpu0-sdk.tar.gz" \
            "output/${TDVP_K230_RELEASE_NAME}" 2>&1 | tee "output/${TDVP_K230_RELEASE_NAME}/tdvp-sdk-validation.log"
          (cd "output/${TDVP_K230_RELEASE_NAME}" && sha256sum tdvp-sdk-validation.log >> SHA256SUMS)

      - name: Upload candidate image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TDVP_K230_RELEASE_NAME }}
          path: output/${{ env.TDVP_K230_RELEASE_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: output/${{ env.TDVP_K230_RELEASE_NAME }}/*

  promote:
    name: Publish verified r12 candidate without rebuilding
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.promote_run_id }}
      RELEASE_TAG: v2026.10.08-r12-rc1
    steps:
      - name: Download and verify the accepted candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" == 37614242646 ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e '.conclusion == "success" and .status == "completed" and .head_sha == "eae0464ed431cefe57a29e88717e837d2a1ff611"' run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" > artifacts.json
          artifact=tdvp-k230-labwc-desktop-d6710d2955e15e050c162383cabb240494542464
          jq -e --arg name "$artifact" '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' artifacts.json
          gh run download "$SOURCE_RUN" --name "$artifact" --dir bundle
          cd bundle
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path.cwd()
          entries = Path('SHA256SUMS').read_text().splitlines()
          assert len(entries) == 13, 'unexpected bundle inventory'
          names = set()
          for entry in entries:
              digest, name = entry.split('  ', 1)
              path = Path(name)
              assert path.name == name and not path.is_symlink() and path.is_file(), name
              assert name not in names, name
              names.add(name)
              with path.open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert actual == digest, f'checksum mismatch: {name}'
          assert {p.name for p in root.iterdir()} == names | {'SHA256SUMS'}, 'untracked bundle files'
          assert len([n for n in names if n.endswith('.img.gz')]) == 1
          assert len([n for n in names if n.endswith('-cpu0-sdk.tar.gz')]) == 1
          print('Verified all 13 original bundle files')
          PY
      - name: Publish separate release assets
        shell: bash
        run: |
          set -euo pipefail
          source_commit=d6710d2955e15e050c162383cabb240494542464
          gh api "repos/$GH_REPO/commits/$source_commit" --jq '.parents[].sha' | grep -Fx eae0464ed431cefe57a29e88717e837d2a1ff611
          cat > notes.md <<'EOF'
          K230 maintenance candidate for device acceptance. This pre-release keeps r11 as the stable Latest release.

          Includes opkg ownership lifetime fixes, installed OR-dependency reuse, held version constraints, Essential+hold base file ownership protection, and the paired relocatable CPU0 package SDK.

          Download the `.img.gz` asset to flash an SD card. Download the `-cpu0-sdk.tar.gz` asset only for development. Assets retain their original CI names and bytes; verify them using SHA256SUMS. The SDK and image must be used as a pair.

          Provenance: successful CI run https://github.com/vicliu624/t-display-k230-vision-platform/actions/runs/37614242646, PR head eae0464ed431cefe57a29e88717e837d2a1ff611, built PR merge commit d6710d2955e15e050c162383cabb240494542464. This tag points to the actual built merge commit. All 13 original bundle checksums are verified before publication. The original CI passed the full image build and isolated SDK relocation checks; local validation passed 35 native opkg and 25 SDK regressions.

          Final-image device boot acceptance, permanent system opkg entry-point acceptance, and paired feed signing/promotion remain pending. This release does not promote the stable package feed. Keep the r11 image and SDK for rollback.
          EOF
          # Create the draft with a maintainer identity before dispatch. The
          # integration token cannot create tags at commits changing workflows.
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'select(.isDraft and .isPrerelease)' | grep -q .
          [[ "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" == "$source_commit" ]]
          gh release upload "$RELEASE_TAG" bundle/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
