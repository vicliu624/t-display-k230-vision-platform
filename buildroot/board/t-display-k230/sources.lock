# T-Display K230 Vision Platform source lock.
# Updated: 2026-07-16
# Purpose: pin external inputs before they become platform build facts.

[buildroot]
role = build engine
source = https://gitlab.com/buildroot.org/buildroot.git
version = 2025.02.14
commit = 898251ee2b83a9cd5ae0ae5db57828035a5a6f85
local_path = buildroot/buildroot

[k230_linux_sdk]
role = primary K230 Linux baseline reference
source = https://github.com/kendryte/k230_linux_sdk.git
branch = dev
commit = 5e1f7cfc794e111a447e4db57815f2cc9dc8c0c7
verified = git ls-remote refs/heads/dev on 2026-07-16
local_reference_path = .tmp/k230_linux_sdk

[k230_linux_sdk.profile]
role = closest official K230/CanMV Linux profile
path = buildroot-overlay/configs/k230_canmv_v3_defconfig

[linux_kernel]
role = K230 big-core Linux kernel
source = https://github.com/ruyisdk/linux-xuantie-kernel.git
commit = 7d4e1f444f461dbe3833bd99a4640e7b6c2cd529
version = 6.6.36
defconfig = k230
dts = canaan/k230-canmv-v3-lcd canaan/k230-canmv-v3
verified = git fetch --depth 1 on 2026-07-16

[opensbi]
role = supervisor firmware for SDK blinux flow
source = Buildroot OpenSBI package plus k230_linux_sdk overlay
version = 1.4
platform = generic
payload_mode = FW_TEXT_START=0, fw_jump image wrapped as fw_jump_add_uboot_head.bin

[uboot]
role = K230 bootloader
source = Buildroot U-Boot package plus k230_linux_sdk overlay
version = 2022.10
board = k230_canmv_v3
default_device_tree = k230_canmv_v3
env_source = buildroot/board/t-display-k230/uboot-linux.env
env_offset = 0x1e0000
env_size = 0x10000

[image_layout]
role = SD-card image layout baseline
source_path = buildroot-overlay/board/canaan/k230-soc/genimage.cfg
partition_table = gpt
spl_1_offset = 1M
spl_2_offset = 0x180000
uboot_env_offset = 0x1e0000
uboot_offset = 2M
env_offset = 0x380000
boot_offset = 30M
boot_size = 80M
rootfs_offset = 128M

[artifact_import]
role = local import boundary for SDK-derived boot binaries
tool = buildroot/board/t-display-k230/tools/import-boot-artifacts.sh
builder = buildroot/board/t-display-k230/tools/build-sdk-boot-artifacts.sh
source_images_dir = <k230_linux_sdk>/output/k230_canmv_v3_defconfig/images
local_manifest = buildroot/board/t-display-k230/boot-artifacts/manifest.local
accepted_after = board boot validation

[toolchain_reference]
role = SDK reference toolchain, not yet TDVP build requirement
path = /opt/toolchain/Xuantie-900-gcc-linux-6.6.0-glibc-x86_64-V3.0.2/
prefix = riscv64-unknown-linux-gnu
libc = glibc
headers = 6.6
target_optimization = -mcpu=c908v -mtune=c908 -mrvv-v0p10-compatible -mrvv-auto-vectorize

[t_display_hardware_reference]
role = T-Display K230 board hardware facts
source = https://github.com/Xinyuan-LilyGO/T-Display-K230_canmv_rt.git
commit = 111b67743f0c238b717ae502a4b4a9638c45f691
status = hardware reference only
