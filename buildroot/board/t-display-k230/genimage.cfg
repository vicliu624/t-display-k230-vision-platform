# T-Display K230 candidate SD-card image layout.
#
# This layout follows the selected K230 Linux SDK baseline:
#   kendryte/k230_linux_sdk
#   buildroot-overlay/board/canaan/k230-soc/genimage.cfg
#
# TDVP keeps the same fixed bootloader regions and Linux boot/rootfs partition
# shape while replacing the full SDK package set with a minimal platform rootfs.

image sysimage-sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition uboot_spl_1 {
		in-partition-table = false
		offset = 1M
		image = "boot-artifacts/spl.bin"
	}

	partition uboot_spl_2 {
		in-partition-table = false
		offset = 0x180000
		image = "boot-artifacts/spl.bin"
	}

	partition uboot_env {
		in-partition-table = false
		offset = 0x1e0000
		image = "boot-artifacts/u-boot.env.bin"
		size = 0x20000
	}

	partition uboot {
		in-partition-table = false
		offset = 2M
		image = "boot-artifacts/u-boot.bin"
	}

	partition env {
		in-partition-table = false
		offset = 0x380000
		image = "boot-artifacts/u-boot.env.bin"
	}

	partition boot {
		offset = 30M
		partition-type-uuid = "L"
		image = "boot.ext4"
		size = 80M
	}

	partition rootfs {
		offset = 128M
		partition-type-uuid = "L"
		image = "rootfs.ext2"
	}
}
