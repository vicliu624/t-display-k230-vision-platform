# K230 audio profile
#
# The K230 I2S driver is stable in ALSA's period-driven mode, but its mmap
# timer-scheduled path can repeatedly underrun and eventually crash the
# PulseAudio ALSA sink.  Keep the sound card at its native desktop format and
# let default.pa select the non-timer-scheduled card profile.
default-sample-format = s16le
default-sample-rate = 44100
alternate-sample-rate = 44100
default-sample-channels = 2
default-channel-map = front-left,front-right
avoid-resampling = true

# Four 256-frame periods at 44.1 kHz give a 23.2 ms hardware queue. The
# explicit module-alsa-sink declaration in default.pa repeats this contract;
# retain these defaults for PulseAudio modules that consult daemon.conf.
default-fragments = 4
default-fragment-size-msec = 6

# Keep the normal user-session server model: applications authenticate through
# the per-user socket and no process other than PulseAudio owns the ALSA card.
exit-idle-time = -1
