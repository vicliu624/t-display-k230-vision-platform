[config]
bm_open_method=0

[desktop]
# PCManFM's Wayland desktop surface replaces swaybg and receives normal left,
# right and long-press input. Keep the established TDVP artwork and palette.
wallpaper_mode=fit
wallpaper_common=1
wallpaper=/usr/share/backgrounds/tdvp-pda-paper.png
desktop_bg=#f4f0e6
desktop_fg=#171717
desktop_shadow=#f4f0e6
desktop_font=DejaVu Sans Mono 11
show_wm_menu=0
show_documents=0
show_home=0
show_trash=0

[ui]
win_width=900
win_height=500
view_mode=0
show_hidden=0
sort=name;ascending;
