[panel]
# Keep the mature Raspberry Pi panel implementation, but make it a single
# TDVP top bar sized for the 1232x568 logical display. No autohide is used:
# Labwc does not implement the optional Wayfire shell protocol needed by it.
css_path=/etc/wf-panel-pi/tdvp.css
widgets_left=smenu spacing8 window-list
widgets_center=none
# Every status widget below is built directly from Raspberry Pi's maintained
# pplug sources. TDVP supplies the board, compositor and visual theme only.
# `power` is deliberately omitted: it reports Raspberry Pi-specific power
# warnings that do not exist on this board and otherwise shows an ambiguous
# fallback icon.  There is exactly one audio control: `volumepulse`.
widgets_right=netman spacing4 volumepulse spacing4 batt spacing4 clock
icon_size=32
minimal_height=64
autohide=false
monitor=0
position=top
layer=top
notify_enable=false
gestures_touch_only=true
