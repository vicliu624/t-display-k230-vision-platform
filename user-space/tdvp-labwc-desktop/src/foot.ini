[main]
font=monospace:size=14
# A launcher entry must look like a normal application window.  On the
# 1232x568 panel a maximized black terminal masks the desktop so completely
# that it is indistinguishable from a failed launch.  Labwc supplies the
# server-side titlebar with touchable minimize/maximize/close controls.
initial-window-mode=windowed
initial-window-size-pixels=900x460
pad=16x14
resize-delay-ms=100

[csd]
preferred=server
hide-when-maximized=no
double-click-to-maximize=yes
